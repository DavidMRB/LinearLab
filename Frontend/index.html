<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinearLab | Programación Lineal</title>
  <link rel="icon" type="image/svg+xml" href="image.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          screens: { short: { raw: "(max-height: 850px)" } },
          colors: { ink: "#36494E", steel: "#7EA0B7", ice: "#A9CEF4", mist: "#E8EEF2" },
          fontFamily: { sans: ["Manrope", "sans-serif"], mono: ["DM Mono", "monospace"] }
        }
      }
    };
  </script>
  <style>
    /* Aparición suave de las tarjetas de inicio. fill-mode "backwards": al terminar se
       liberan los estilos, así el hover (translate/sombra) sigue funcionando. */
    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .method-card { animation: cardFadeIn .7s cubic-bezier(.22, .8, .25, 1) backwards; animation-delay: calc(var(--i, 0) * 320ms + 200ms); }
    @media (prefers-reduced-motion: reduce) { .method-card { animation: none; } }
    /* Táctil / pantallas pequeñas: campos y botones con altura mínima cómoda (44px). */
    @media (max-width: 767px), (pointer: coarse) {
      #calculator input, #calculator select, #calculator button { min-height: 44px; }
      #calculator select { font-size: 16px; }
    }
    @media (max-width: 767px) { #calculator input { font-size: 16px; } } /* evita el zoom automático de iOS al enfocar */
    #calculator.transport-mode { width: min(100%, var(--transport-width, 760px)); max-width: min(100%, var(--transport-width, 760px)); }
    #calculator.assignment-mode { width: min(100%, var(--assignment-width, 760px)); max-width: min(100%, var(--assignment-width, 760px)); }
    #calculator.flow-mode { width: min(100%, var(--flow-width, 760px)); max-width: min(100%, var(--flow-width, 760px)); }
    #transportMatrix table { table-layout: fixed; }
    #transportMatrix th, #transportMatrix td { min-width: 0; }
    #transportMatrix input { box-sizing: border-box; min-width: 0; width: 100%; }
    #assignmentMatrix { overflow-x: auto; }
    #assignmentMatrix table { width: max(100%, var(--assignment-width, 420px)); min-width: var(--assignment-width, 420px); table-layout: auto; }
    #assignmentMatrix th, #assignmentMatrix td { min-width: 0; }
    #assignmentMatrix input { box-sizing: border-box; min-width: 0; width: 100%; }
    @media (max-width: 640px) {
      #calculator.transport-mode { width: 100%; max-width: 100%; }
      #calculator.assignment-mode { width: 100%; max-width: 100%; }
      #calculator.flow-mode { width: 100%; max-width: 100%; }
      #transportMatrix { margin-inline: -.25rem; padding-inline: .25rem; }
      #transportMatrix th, #transportMatrix td { padding: .125rem; }
      #transportMatrix input { padding-inline: .25rem; font-size: .7rem; }
      #assignmentMatrix { margin-inline: -.25rem; padding-inline: .25rem; }
      #assignmentMatrix table { min-width: 360px; }
      #assignmentMatrix th, #assignmentMatrix td { padding: .125rem; }
      #assignmentMatrix input { padding-inline: .25rem; font-size: .7rem; }
      #flowEdges { margin-inline: -.25rem; padding-inline: .25rem; }
      #flowEdges input { min-width: 0; padding-inline: .25rem; font-size: .7rem; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="min-h-screen overflow-x-hidden bg-[radial-gradient(circle_at_10%_10%,rgba(169,206,244,.65),transparent_25%),linear-gradient(135deg,#F7FAFC,#E7EEF3)] font-sans text-ink">
    <div id="app"></div>
  </main>
  <div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-50 -translate-x-1/2 translate-y-24 rounded-xl bg-ink px-5 py-3 text-sm text-white opacity-0 shadow-2xl transition [&.show]:translate-y-0 [&.show]:opacity-100">Campos actualizados</div>
  <script src="config.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
